{% extends "base.html" %}
{% block content %}
  <h1>Login</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>User ID</label>
    <input name="user_id" type="text" required />

    <label>Password</label>
    <input name="password" type="password" required />

    <button type="submit">Login</button>
  </form>
{% endblock %}
